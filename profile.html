<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Worldwide Life Matter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">

  <div class="logo">
    🌍 Worldwide Life Matter
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="submit.html">Submit</a>
    <a href="profile.html">My Profile</a>
  </nav>

</header>

<main>

<h1>My Profile</h1>

<div class="profile-container">

<div class="profile-picture">

<img
id="avatarPreview"
src="https://placehold.co/180x180?text=Profile"
alt="Profile Picture"
class="avatar">

<br><br>

<input
type="file"
id="avatar"
accept="image/*">

</div>

<div class="profile-form">

<label>Bio</label>

<textarea
id="bio"
rows="5"
placeholder="Tell people about yourself..."></textarea>

<br><br>

<label>Country</label>

<input
type="text"
id="country"
placeholder="Country">

<br><br>

<label>Website</label>

<input
type="url"
id="website"
placeholder="https://example.com">

<br><br>

<button id="saveProfile">
Save Profile
</button>

<p id="message"></p>

</div>

</div>

</main>
