<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Public Profile - Worldwide Life Matter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">

  <div class="logo">
    🌍 Worldwide Life Matter
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="submit.html">Submit Story</a>
    <a href="profile.html">My Profile</a>
  </nav>

</header>

<main>

<h1>Public Profile</h1>

<div id="profile-message">
  Loading profile...
</div>

<div id="public-profile" style="display: none;">

  <div class="profile-container">

    <div class="profile-picture">

      <img
        id="avatar"
        src="https://placehold.co/180x180?text=Profile"
        alt="Profile Picture"
        class="avatar">

    </div>

    <div class="profile-form">

      <h2 id="profile-name">
        User
      </h2>

      <p>
        <strong>Bio:</strong>
      </p>

      <p id="bio">
        No bio available.
      </p>

      <p>
        <strong>Country:</strong>
        <span id="country">
          Not provided
        </span>
      </p>

      <p>
        <strong>Website:</strong>
        <a
          id="website"
          href="#"
          target="_blank"
          rel="noopener noreferrer">
        </a>
      </p>

    </div>

  </div>

  <hr>

  <h2>Stories by this user</h2>

  <div id="user-stories">
    Loading stories...
  </div>

</div>

<br>

<p>
  <a href="stories.html">
    ← Back to Stories
  </a>
</p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="public-profile.js"></script>

</body>
</html>
