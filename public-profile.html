<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Public Profile - Worldwide Life Matter
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="top-header">

  <div class="logo">
    🌍 Worldwide Life Matter
  </div>


  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="stories.html">
      Stories
    </a>

    <a href="submit.html">
      Submit Story
    </a>

    <a href="profile.html">
      My Profile
    </a>

  </nav>

</header>


<main class="public-profile-page">


  <div
    id="profile-loading"
    class="profile-loading"
  >

    <p>
      Loading profile...
    </p>

  </div>


  <div
    id="profile-error"
    class="profile-error"
    style="display:none;"
  >

    <p>
      Unable to load this profile.
    </p>

  </div>


  <div
    id="profile-content"
    style="display:none;"
  >


    <!-- PROFILE HEADER -->

    <section class="public-profile-card">


      <div class="public-profile-picture">

        <img
          id="profile-avatar"
          src="https://placehold.co/180x180?text=Profile"
          alt="Profile Picture"
          class="avatar"
        >

      </div>


      <div class="public-profile-info">

        <h1 id="profile-name">
          User
        </h1>


        <p class="profile-country">

          <strong>
            🌍 Country:
          </strong>

          <span id="profile-country">
            Not provided
          </span>

        </p>


        <p
          id="profile-bio"
          class="profile-bio"
        >
        </p>


        <p id="profile-website-container">

          <strong>
            🔗 Website:
          </strong>

          <a
            id="profile-website"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            style="display:none;"
          >
            Visit Website
          </a>

          <span id="no-website">
            Not provided
          </span>

        </p>

      </div>


    </section>
    <!-- PROFILE STATISTICS -->

    <section class="profile-stats">

      <div class="profile-stat">

        <strong id="story-count">
          0
        </strong>

        <span>
          Stories
        </span>

      </div>


      <div class="profile-stat">

        <strong id="like-count">
          0
        </strong>

        <span>
          Likes
        </span>

      </div>

    </section>


    <!-- FOLLOW SYSTEM -->

    <section class="follow-section">

      <div class="follow-stats">

        <div class="follow-stat">

          <strong id="followers-count">
            0
          </strong>

          <span>
            Followers
          </span>

        </div>


        <div class="follow-stat">

          <strong id="following-count">
            0
          </strong>

          <span>
            Following
          </span>

        </div>

      </div>


      <button
        id="follow-button"
        style="display:none;"
      >
        Follow
      </button>


      <p
        id="follow-message"
      ></p>

    </section>


    <!-- USER STORIES -->

    <section class="user-profile-stories">

      <h2>
        Stories by this user
      </h2>


      <div id="user-stories">

        <p>
          Loading stories...
        </p>

      </div>

    </section>


    <br>


    <p>

      <a href="stories.html">
        ← Back to Stories
      </a>

    </p>


  </div>
</main>


<!-- SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
  src="supabase.js"
></script>


<!-- PUBLIC PROFILE JAVASCRIPT -->

<script
  src="public-profile.js"
></script>


</body>

</html>
